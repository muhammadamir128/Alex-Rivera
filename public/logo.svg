<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <style>
      .logo-bg { animation: breathe 2.5s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; }
      }
    </style>
  </defs>
  <!-- Rounded square background -->
  <rect class="logo-bg" x="1" y="1" width="34" height="34" rx="9" ry="9" fill="url(#grad)"/>
  <!-- Inner ring -->
  <rect x="1" y="1" width="34" height="34" rx="9" ry="9" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="0.8"/>
  <!-- MA text -->
  <text
    x="18"
    y="24"
    text-anchor="middle"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-weight="700"
    font-size="13"
    letter-spacing="-0.5"
    fill="white"
  >MA</text>
</svg>
